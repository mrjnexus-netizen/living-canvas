name: LIVING CANVAS · download Krea videos
on:
  push:
    paths: ['library/fetch-list.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    concurrency: {group: lc-fetch, cancel-in-progress: true}
    steps:
      - name: let the upload from the admin panel finish first
        run: sleep 60
      - uses: actions/checkout@v4
      - name: download
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          L = json.load(open('library/fetch-list.json'))
          for it in L:
              if not it.get('url'): continue
              p = 'library/' + it['path']
              if os.path.exists(p) and os.path.getsize(p) > 20000: continue
              os.makedirs(os.path.dirname(p), exist_ok=True)
              try:
                  req = urllib.request.Request(it['url'], headers={'User-Agent': 'Mozilla/5.0'})
                  open(p, 'wb').write(urllib.request.urlopen(req, timeout=120).read()); print('ok', p)
              except Exception as e: print('failed', p, e)
          PY
      - name: commit
        run: |
          git config user.name "living-canvas-bot"
          git config user.email "living-canvas-bot@users.noreply.github.com"
          git add library
          git diff --cached --quiet && exit 0
          git commit -m "videos downloaded from Krea"
          for i in 1 2 3 4 5 6; do git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0; sleep 20; done
          exit 1
